name: Minify JS và CSS cho VT Zone

on:
  push:
    branches: [ main ]
    paths: ['js/*.js', 'css/*.css']
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công

permissions:
  contents: write # Cấp quyền ghi để Action tự commit file .min

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cài đặt công cụ nén hiện đại (Terser & Clean-CSS)
        run: |
          npm install -g terser clean-css-cli

      - name: Tiến hành nén file
        run: |
          # Nén JS: Bỏ qua các file đã có đuôi .min.js
          for f in js/*.js; do
            if [[ ! $f == *.min.js ]]; then
              terser "$f" --compress --mangle -o "${f%.js}.min.js"
            fi
          done
          
          # Nén CSS: Bỏ qua các file đã có đuôi .min.css
          for f in css/*.css; do
            if [[ ! $f == *.min.css ]]; then
              cleancss "$f" -o "${f%.css}.min.css"
            fi
          done

      - name: Commit và đẩy file nén lên Repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "⚡ Tối ưu: Tự động nén file JS/CSS [skip ci]"
          file_pattern: 'js/*.min.js css/*.min.css'
