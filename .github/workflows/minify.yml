name: Auto Minify All CSS and JS

on:
  push:
    paths:
      # Quét mọi file .js và .css ở bất kỳ thư mục nào trong repo
      - '**.js'
      - '**.css'
      # Bỏ qua các file đã có đuôi .min để tránh vòng lặp vô tận
      - '!**.min.js'
      - '!**.min.css'

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Minifier Tools
        run: npm install -g clean-css-cli terser

      - name: Minify CSS files
        run: |
          # Dấu chấm (.) báo hiệu quét từ thư mục gốc của repo
          # Bỏ qua thư mục node_modules (nếu có) để tăng tốc độ và tránh lỗi
          find . -type f -name "*.css" ! -name "*.min.css" ! -path "*/node_modules/*" -exec sh -c 'cleancss -o "${0%.css}.min.css" "$0"' {} \;

      - name: Minify JS files
        run: |
          # Tương tự với JS
          find . -type f -name "*.js" ! -name "*.min.js" ! -path "*/node_modules/*" -exec sh -c 'terser "$0" -o "${0%.js}.min.js" -c -m' {} \;

      - name: Commit and Push minified files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify all CSS and JS"
          # Lấy tất cả các file .min.js và .min.css ở bất kỳ đâu để commit
          file_pattern: '**/*.min.js **/*.min.css'
