name: VT Zone CDN Obfuscator

on:
  push:
    branches: [ main ]
    paths: ['js/*.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate JS Files
        run: |
          for f in js/*.js; do
            # Chỉ xử lý file gốc, bỏ qua các file đã có đuôi .min.js
            if [[ ! $f == *.min.js ]]; then
              javascript-obfuscator "$f" \
                --output "${f%.js}.min.js" \
                --compact true \
                --control-flow-flattening true \
                --dead-code-injection true \
                --string-array true \
                --rename-globals false \
                --self-defending true
            fi
          done

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🔐 Obfuscate: Mã hóa và bảo vệ mã nguồn JS [skip ci]"
          file_pattern: 'js/*.min.js'
