name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minification tools
        run: npm install -g terser clean-css-cli

      - name: Minify JS files
        run: |
          echo "=== Đang nén JS ==="
          find . -name "*.js" -not -name "*.min.js" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.js}.min.js"
            npx terser "$file" --compress --mangle --output "$minfile" --source-map "url='$(basename $minfile).map'"
          done

      - name: Minify CSS files
        run: |
          echo "=== Đang nén CSS ==="
          # Tìm tất cả file .css (loại trừ .min.css và node_modules)
          find . -name "*.css" -not -name "*.min.css" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.css}.min.css"
            echo "Processing: $file -> $minfile"
            # Sử dụng npx để đảm bảo lệnh cleancss luôn chạy được
            npx cleancss --level 2 --source-map -o "$minfile" "$file" || echo "⚠️ Lỗi tại file: $file"
          done

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Pattern này sẽ gom tất cả các file .min và .map mới tạo
          file_pattern: '**/*.min.js **/*.min.css **/*.map'
          skip_dirty_check: false
