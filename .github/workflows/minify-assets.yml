name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g terser clean-css-cli

      - name: Minify Everything
        run: |
          echo "🚀 Đang quét và nén toàn bộ repo..."
          
          # Nén tất cả file JS (loại trừ .min.js và node_modules)
          find . -type f -name "*.js" ! -name "*.min.js" ! -path "*/node_modules/*" | while read f; do
            echo "Compressing JS: $f"
            terser "$f" --compress --mangle --output "${f%.js}.min.js"
          done
          
          # Nén tất cả file CSS (loại trừ .min.css và node_modules)
          find . -type f -name "*.css" ! -name "*.min.css" ! -path "*/node_modules/*" | while read f; do
            echo "Compressing CSS: $f"
            cleancss -o "${f%.css}.min.css" "$f"
          done

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Dùng dấu sao tổng quát để GitHub tự tìm các file mới sinh ra
          file_pattern: |
            *.min.js
            *.min.css
            *.map
            **/*.min.js
            **/*.min.css
            **/*.map
