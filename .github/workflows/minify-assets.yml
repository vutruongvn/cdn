name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g terser clean-css-cli

      - name: Minify Assets
        run: |
          echo "🚀 Đang bắt đầu nén file..."
          
          # Nén JS
          find . -type f -name "*.js" ! -name "*.min.js" ! -path "*/node_modules/*" | while read f; do
            terser "$f" --compress --mangle --output "${f%.js}.min.js"
            echo "✅ JS: $f"
          done
          
          # Nén CSS - Dùng cách an toàn nhất
          find . -type f -name "*.css" ! -name "*.min.css" ! -path "*/node_modules/*" | while read f; do
            # Dùng cleancss trực tiếp và ép tạo file
            cleancss -o "${f%.css}.min.css" "$f"
            echo "✅ CSS: $f -> ${f%.css}.min.css"
          done

      - name: Force Check (Debug)
        run: |
          echo "--- Kiểm tra thực tế trong thư mục vtzone/css ---"
          ls -R cdn/vtzone/css/ || echo "Thư mục không tồn tại"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Sử dụng dấu sao đại diện để bắt toàn bộ file mới
          file_pattern: 'cdn/vtzone/css/*.min.css cdn/vtzone/js/*.min.js **/*.min.css **/*.min.js **/*.map'
