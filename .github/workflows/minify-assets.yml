name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g terser clean-css-cli

      - name: Minify JS
        run: |
          echo "🚀 Đang xử lý JS..."
          find . -type f -name "*.js" -not -name "*.min.js" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.js}.min.js"
            terser "$file" --compress --mangle --output "$minfile" --source-map "url='$(basename $minfile).map'"
            echo "✅ Done: $minfile"
          done

      - name: Minify CSS
        run: |
          echo "🚀 Đang xử lý CSS..."
          # Dùng npx để đảm bảo gọi đúng lệnh cleancss từ package clean-css-cli
          find . -type f -name "*.css" -not -name "*.min.css" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.css}.min.css"
            echo "Đang nén: $file -> $minfile"
            npx cleancss -o "$minfile" "$file" || echo "❌ Lỗi tại file: $file"
          done

      - name: Verify Files (Debug)
        run: |
          echo "--- Danh sách file .min vừa tạo ---"
          find . -name "*.min.css"
          find . -name "*.min.js"

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Sửa lại pattern để chắc chắn không sót file nào
          file_pattern: |
            **/*.min.js
            **/*.min.css
            **/*.map
          skip_dirty_check: false
