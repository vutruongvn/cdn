name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g terser uglifycss

      - name: Minify JS
        run: |
          find . -type f -name "*.js" -not -name "*.min.js" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.js}.min.js"
            terser "$file" --compress --mangle --output "$minfile" --source-map "url='$(basename $minfile).map'"
          done

      - name: Minify CSS
        run: |
          # Dùng uglifycss để thay thế cho cleancss vì nó ổn định hơn trên môi trường ảo
          find . -type f -name "*.css" -not -name "*.min.css" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.css}.min.css"
            echo "Processing CSS: $file -> $minfile"
            uglifycss "$file" > "$minfile"
          done

      - name: Check files existence (Debug)
        run: |
          echo "Kiem tra file sau khi nen:"
          find . -name "*.min.css"
          find . -name "*.min.js"

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          file_pattern: |
            **/*.min.js
            **/*.min.css
            **/*.map
