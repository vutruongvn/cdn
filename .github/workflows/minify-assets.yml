name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: npm install -g terser clean-css-cli

      - name: Minify Everything
        run: |
          echo "🚀 Đang quét toàn bộ repo để nén..."
          
          # Nén JS: Quét mọi ngóc ngách
          find . -type f -name "*.js" ! -name "*.min.js" ! -path "*/node_modules/*" | while read f; do
            echo "Nén JS: $f"
            terser "$f" --compress --mangle --output "${f%.js}.min.js"
          done
          
          # Nén CSS: Quét mọi ngóc ngách (kể cả vtzone/css)
          find . -type f -name "*.css" ! -name "*.min.css" ! -path "*/node_modules/*" | while read f; do
            echo "Nén CSS: $f"
            # Ép cleancss ghi file ra đúng đường dẫn của file gốc
            cleancss -o "${f%.css}.min.css" "$f"
          done

      - name: Verify Output (Debug)
        run: |
          echo "--- Kiểm tra danh sách file .min vừa tạo ---"
          find . -name "*.min.css"
          find . -name "*.min.js"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Dùng pattern cực rộng để không bao giờ bị lỗi 'did not match any files'
          file_pattern: |
            **/*.min.js
            **/*.min.css
            **/*.map
