name: Auto Minify JS & CSS

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install -g terser clean-css-cli
          echo "Kiểm tra phiên bản công cụ:"
          terser --version
          cleancss --version

      - name: Minify JS
        run: |
          echo "🚀 Đang xử lý JS..."
          find . -type f -name "*.js" -not -name "*.min.js" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.js}.min.js"
            terser "$file" --compress --mangle --output "$minfile" --source-map "url='$(basename $minfile).map'"
            echo "✅ Created: $minfile"
          done

      - name: Minify CSS
        run: |
          echo "🚀 Đang xử lý CSS..."
          # Dùng lệnh trực tiếp thay vì npx để tránh delay/hỏi xác nhận
          find . -type f -name "*.css" -not -name "*.min.css" -not -path "*/node_modules/*" | while read file; do
            minfile="${file%.css}.min.css"
            echo "Đang nén: $file -> $minfile"
            cleancss -o "$minfile" "$file"
            
            # Kiểm tra xem file có thực sự được tạo ra không
            if [ -f "$minfile" ]; then
              echo "✅ Thành công: $minfile"
              ls -l "$minfile"
            else
              echo "❌ Thất bại: Không tìm thấy file $minfile sau khi nén!"
            fi
          done

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-minify JS & CSS [skip ci]"
          # Ép GitHub add tất cả file .min mới, kể cả nếu nó bị ẩn
          file_pattern: |
            **/*.min.js
            **/*.min.css
            **/*.map
          skip_dirty_check: false
